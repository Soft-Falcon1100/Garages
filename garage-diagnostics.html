  --accent:#4FB6D6; --accent-ink:#06222D; --panel:#1B2A34; --panel-ink:#EAF1F5; --panel-muted:#9DB0BC;
  --ok:#7FD6A0; --ok-bg:#12301F; --warn:#F2C463; --warn-bg:#3A2C08; --bad:#FF9A92; --bad-bg:#3C1512; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.1;font-weight:600}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:600}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--panel);color:var(--panel-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel .muted{color:var(--panel-muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{min-height:46px;padding:0 16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:transparent;color:var(--accent);padding:0 6px;min-height:44px}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.row:focus-visible,.tab:focus-visible,.chip:focus-visible,.seg button:focus-visible,.step:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px}
textarea{padding:10px 12px;min-height:90px;resize:vertical}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.seg{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:8px;background:transparent;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.kv .k{font-size:12px;color:var(--panel-muted)} .kv .v{font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{width:100%;text-align:left;min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.row .code{font-family:var(--mono);font-size:15px;min-width:54px}
.row .rt{flex:1;min-width:0;font-size:14px;line-height:1.3}
.list{display:flex;flex-direction:column;gap:8px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.sev1{background:var(--ok-bg);color:var(--ok)} .sev2{background:var(--warn-bg);color:var(--warn)} .sev3{background:var(--bad-bg);color:var(--bad)}
.tag{background:var(--surface2);color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.info{background:var(--surface2);color:var(--muted);border-radius:10px;padding:10px 12px;font-size:13px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px}
.good{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:13px}
.back{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font-weight:500;cursor:pointer;padding:0}
.bigcode{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.01em;line-height:1}
.step{width:100%;text-align:left;display:flex;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line);background:transparent;cursor:pointer;align-items:flex-start;min-height:56px}
.step:first-of-type{border-top:0}

.step[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step[aria-checked="true"] .st{color:var(--muted);text-decoration:line-through}
.st{font-weight:600}
ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs div{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;min-height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.card,.panel{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
.ref{display:inline;min-height:28px;padding:3px 8px;margin:0 1px;border:0;border-radius:6px;background:var(--surface2);color:var(--accent);font-weight:600;font-size:inherit;line-height:inherit;cursor:pointer}
.ref:focus-visible,.mbox:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mstep{display:flex;gap:8px;padding:12px 0;border-top:1px solid var(--line);scroll-margin-top:16px;border-radius:8px}
.mstep:first-child{border-top:0}
.mbox{flex:none;width:44px;height:44px;margin:-9px 0 -9px -9px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mbox[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mbox .box{margin:0}
.mbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.num{display:inline-block;min-width:26px;margin-right:6px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.mtext{font-weight:500}
.mstep.done .mtext{color:var(--muted)}
.br{font-size:14px;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.br b{flex:none;font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-top:3px}
.br.y b{background:var(--ok-bg);color:var(--ok)}
.br.n b{background:var(--bad-bg);color:var(--bad)}
details.card>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}

.crumb{min-height:36px;padding:4px 4px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}

.crumbs .here{font-weight:600;color:var(--ink)}
.sect{font-family:var(--display);font-size:20px;line-height:1.25;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600;margin:0}
.spec{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}

.spec .v{font-weight:600}
.pstep{display:flex;gap:8px;padding:10px 0;border-top:1px solid var(--line);line-height:1.5;scroll-margin-top:16px;border-radius:8px}
.pstep:first-child{border-top:0;padding-top:0}
.pstep .num{margin-right:0}
.vinparts>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}

.vp .v{text-align:right;min-width:0;overflow-wrap:anywhere}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
textarea{width:100%;box-sizing:border-box;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:96px;resize:vertical}

misfire:{n:"Misfire",about:"The engine computer sees a cylinder not firing when it should. You may feel a shake at idle or a stumble under load.",warn:"A flashing check engine light means an active misfire that can overheat and damage the catalytic converter. Avoid heavy load until it is fixed.",steps:[["Read freeze-frame data","Note engine speed, load and coolant temperature when the code set, and whether one cylinder or several are affected."],["Check for related codes","Fuel trim, oxygen sensor and ignition codes can point to a shared cause."],["Inspect ignition parts on the affected cylinder","Look at the spark plug and coil connector for wear, oil, cracks or heat damage."],["Swap and retest","Move the coil to a different cylinder, clear the code, and see whether the misfire follows it."],["Check fuel and compression","If ignition is fine, test the injector circuit and run a compression test."]]},
trim:{n:"Fuel trim",about:"The engine computer is adding or removing fuel beyond its normal range to keep the air-fuel mixture correct.",steps:[["Check long-term and short-term fuel trim","Compare trims at idle and at 2,500 rpm. A lean condition that improves at higher rpm points to a vacuum leak."],["Look for air leaks","Inspect intake hoses, the intake boot after the airflow sensor, and vacuum lines for cracks."],["Check the airflow sensor","Inspect the MAF element for dirt and compare its reading with a known good value."],["Test fuel pressure","Confirm pressure at idle and under load against the specification for this engine."],["Inspect the exhaust","A leak before the front oxygen sensor can read as lean."]]},
o2:{n:"Oxygen sensor",about:"An oxygen sensor reading is outside its expected range or is responding too slowly.",steps:[["Check live sensor data","Watch the voltage or current while revving the engine and see whether it switches quickly."],["Inspect wiring and connector","Look for melted insulation, oil in the connector and loose pins."],["Check for exhaust leaks","Leaks near the sensor let in outside air and skew readings."],["Rule out a mixture problem","Review fuel trims. A sensor can be reporting a real lean or rich condition."],["Replace the sensor if it fails the checks","Use the correct sensor for the bank and position."]]},
o2h:{n:"Oxygen sensor heater",about:"The heater inside an oxygen sensor is not drawing the expected current.",steps:[["Check the heater fuse","Find the fuse that feeds the sensor heater and confirm it is intact."],["Measure heater resistance","Compare the heater resistance with the specification for the sensor."],["Check power and ground at the connector","Confirm battery voltage and a good ground with the key on."],["Inspect wiring","Look for chafing near the exhaust."],["Replace the sensor if the heater is open","A failed heater cannot be repaired."]]},
cat:{n:"Catalytic converter",about:"The converter is not cleaning the exhaust as well as the computer expects, or the downstream fuel trim is off.",steps:[["Check for other codes first","Misfire, fuel trim and oxygen sensor codes can cause a catalyst code."],["Look for exhaust leaks","Inspect the joints and manifold upstream of the rear sensor."],["Compare front and rear oxygen sensor traces","A healthy converter shows a steady rear sensor while the front switches."],["Check the rear sensor","A slow or biased rear sensor can mimic a tired converter."],["Replace the converter last","Only after the causes above are ruled out."]]},
evap:{n:"Evaporative emissions",about:"The fuel vapor system holds a pressure or vacuum test and the computer found a leak or a valve fault.",steps:[["Check the fuel cap","Reseat it until it clicks, inspect the seal, and replace it if cracked."],["Inspect hoses and the filler neck","Look for cracks, loose clamps and rust near the filler."],["Test the purge and vent valves","Listen for a click when commanded with a scan tool, and check for stuck open or stuck closed."],["Smoke test the system","A smoke machine shows the exact leak location."],["Clear codes and recheck","The monitor needs a full drive cycle to re-run."]]},
air:{n:"Air intake sensor",about:"An airflow or pressure sensor signal is out of range or does not match what the engine is doing.",steps:[["View live sensor data","Compare the reading at key on engine off, at idle and at higher rpm."],["Inspect the sensor and connector","Check for dirt, oil, corrosion and bent pins."],["Check for intake leaks","Unmetered air changes how airflow and pressure sensors behave."],["Check reference voltage and ground","Confirm the sensor is supplied correctly at the connector."],["Replace the sensor if it still fails","Clean a MAF element only with a cleaner made for it."]]},
temp:{n:"Temperature sensor",about:"A temperature signal is out of range, or the engine is taking too long to reach operating temperature.",steps:[["Compare sensor reading with actual temperature","With a cold engine, the reading should match ambient."],["Check coolant level","Low coolant can give false readings."],["Inspect connector and wiring","Look for corrosion and loose terminals."],["Test the thermostat","Watch warm-up. A thermostat stuck open keeps the engine cool."],["Replace the sensor or thermostat as indicated","Refill and bleed the cooling system after any coolant work."]]},
tps:{n:"Throttle or pedal sensor",about:"A throttle or accelerator pedal position sensor disagrees with the other sensor or the commanded position.",steps:[["Compare sensor A and B","The two signals should track each other through the full travel."],["Clean the throttle body","Carbon can restrict movement. Use throttle cleaner and follow the manufacturer's method."],["Check wiring and connector","Look for chafing and loose pins."],["Perform a throttle relearn","Many vehicles need one after cleaning or replacement."],["Replace the sensor or throttle body","Only if readings still disagree."]]},
cam:{n:"Crank or cam sensor",about:"The timing signals from the crank and cam sensors are missing or do not line up.",steps:[["Check oil level and condition","Low or dirty oil can upset variable timing."],["Inspect the sensor and connector","Look for oil, damage and loose mounting."],["Check the signal with a scan tool or scope","Confirm the signal is present while cranking."],["Check timing component wear","On a chain engine, look for stretch using the manufacturer's method."],["Replace the sensor if the signal is bad","Verify timing marks if a timing fault is suspected."]]},
egr:{n:"Exhaust gas recirculation",about:"The EGR system is not flowing as much recirculated exhaust as the computer expects.",steps:[["Command the valve with a scan tool","The engine should stumble at idle when the valve opens."],["Inspect passages for carbon","Clean blocked passages in the valve and intake."],["Check vacuum or electrical control","Look for cracked lines or a failed solenoid."],["Check the position sensor","Confirm it follows the commanded position."],["Replace the valve if it sticks","Clean passages when replacing."]]},
idle:{n:"Idle control",about:"The engine idle speed is not holding where the computer wants it.",steps:[["Check for vacuum leaks","Inspect hoses, intake boot and brake booster line."],["Clean the throttle body","Use throttle cleaner and follow the manufacturer's method."],["Check the idle air control valve","On engines that have one, confirm it moves and is not stuck."],["Check accessory load","A failing alternator or AC compressor can pull idle down."],["Perform an idle relearn","Some vehicles require this after cleaning."]]},
volt:{n:"Charging system",about:"System voltage is outside its normal range.",steps:[["Test battery voltage","With the engine off it should be about 12.6 volts when fully charged."],["Test charging voltage","Running, voltage is typically 13.5 to 14.8 volts. Compare with the specification."],["Inspect cables and grounds","Clean corrosion and check tightness."],["Load test the battery","A weak battery can overwork the alternator."],["Test the alternator","Replace if output is low or erratic."]]},
trans:{n:"Transmission",about:"The transmission module has detected a fault in a sensor, solenoid or the transmission's operation.",steps:[["Check fluid level and condition","Use the manufacturer's procedure. Burnt smell or debris is a warning sign."],["Scan the transmission module","Look for codes the engine scan does not show."],["Inspect wiring and connectors","Check at the transmission and the module."],["Test the sensor or solenoid","Measure resistance and compare with the specification."],["Road test and note when it happens","Record speed, gear and load when the symptom appears."]]},
comm:{n:"Network communication",about:"A control module is not communicating on the vehicle data bus, or the engine computer has an internal fault.",steps:[["Check battery voltage","Low voltage can drop modules off the network."],["Check fuses and grounds","Look at fuses that feed the affected module."],["Scan all modules","See which modules still respond and which do not."],["Inspect the data bus wiring","Check the twisted pair for damage and the connectors for water."],["Test the module","Confirm power, ground and bus signals at its connector before replacing it."]]},
inj:{n:"Fuel delivery",about:"Fuel is not being supplied at the pressure or timing the computer expects.",steps:[["Check fuel pump fuse and relay","Confirm they are intact and the pump runs at key on."],["Measure fuel pressure","Compare with the specification at idle and under load."],["Check the injector circuit","Look for a pulse at the injector connector."],["Inspect the fuel filter","A restricted filter lowers pressure."],["Test or replace the injector or pump","Only after the checks above."]]},
coil:{n:"Ignition coil",about:"An ignition coil circuit is not working normally.",steps:[["Check the coil connector","Look for loose or corroded terminals."],["Swap the coil with another cylinder","See whether the fault follows the coil."],["Check power and ground","Confirm the supply at the coil connector."],["Check the spark plug","A worn plug can overload a coil."],["Replace the coil","Replace the plug at the same time if it is worn."]]},
speed:{n:"Speed or switch sensor",about:"A speed or switch input is missing or reads outside its range.",steps:[["Check live data","Confirm the value changes as expected when driving or pressing the pedal."],["Inspect the sensor and connector","Look for damage and contamination."],["Check wiring","Look for chafing along the harness."],["Check the target","A damaged tone ring or magnet can cause dropouts."],["Replace the sensor if the signal is bad","Verify the fix with a road test."]]},
knock:{n:"Knock sensor",about:"The knock sensor signal is missing or outside the expected range.",steps:[["Check the sensor mounting torque","A loose sensor can give a weak or false signal."],["Inspect wiring and connector","Look for oil and damage, especially in the valley."],["Measure sensor resistance","Compare with the specification."],["Rule out mechanical noise","Loose accessories can mimic knock."],["Replace the sensor","Torque to the specification."]]},
gen:{n:"General",about:"A fault was stored for this circuit.",steps:[["Read freeze-frame data","Note the conditions when the code set."],["Check for related codes","Look for a shared cause."],["Inspect the circuit","Check wiring, connectors and grounds."],["Test the component","Compare readings with the specification."],["Repair and retest","Clear the code and confirm it does not return."]]}};

ogramming and Relearning page (Engine Control Module, Testing and Inspection).",null,null],["Perform ECM/PCM idle learn procedure. See Programming and Relearning page (Engine Control Module, Testing and Inspection).",null,null],["Perform CKP pattern learn procedure. See Programming and Relearning page (Engine Control Module, Testing and Inspection).",null,null],["Test-drive several minutes within recorded freeze data range.",null,null],["Check for Temporary DTCs or DTCs with HDS. Any indicated?","If P0301 to P0304 indicated, check poor connections or loose terminals at ignition coil, injector, and ECM/PCM, then go to troubleshooting DTC P0300 to P0304. If other DTCs, go to their troubleshooting.","Go to step 70."],["Monitor OBD STATUS for P0301 to P0304 in DTCs MENU with HDS. PASSED?","Troubleshooting complete.","FAILED: go to step 1 and recheck. EXECUTING: keep driving until result. OUT OF CONDITION: go to step 68 and recheck."],["Update ECM/PCM if it lacks latest software, or substitute a known-good ECM/PCM.",null,null],["Test-drive several minutes within recorded freeze data range.",null,null],["Check for Temporary DTCs or DTCs with HDS. Any indicated?","If P0301 to P0304 indicated, check poor connections or loose terminals at injector, ignition coil, and ECM/PCM, then go to step 1. If other DTCs, go to their troubleshooting.","If ECM/PCM was updated, troubleshooting complete. If substituted, replace original ECM/PCM."]]},"P0300":{"title":"Random Misfire and any combination of P0301 to P0304","detection":"Misfire frequent enough to raise emissions over two consecutive driving cycles turns the MIL on and stores P0300 (and some of P0301 to P0304). Misfire severe enough to damage the catalyst makes the MIL flash during the misfire and stay on after it stops.","causes":["Poor fuel quality","Fouled or worn spark plugs","Fuel pressure too high or too low (fuel pressure regulator, fuel pump, fuel feed pipe, fuel filter)","MAF/IAT sensor reading outside 14 - 20 gm/s at 4,500 rpm","Low VTEC oil pressure or VTEC system fault","Poor connection or loose terminals at ignition coil, injector, or ECM/PCM","Related DTCs to troubleshoot first: P0107, P0108, P1128, P1129 (MAP sensor); P0171, P0172 (fuel system); P0335, P0339 (CKP sensor); P0365, P0369 (CMP sensor B); P0506, P0507 (idle control); P0511 (IAC valve); P0401, P0404, P0416, P2413 (EGR system)"],"notes":["Troubleshoot related DTCs (MAP, fuel system, CKP, CMP B, idle control, IAC, EGR) first if stored with P0300.","Special tools listed in the manual: pressure gauge adapter 07NAJ-P07010A; A/T low pressure gauge w/panel 07406-0070300; A/T pressure hose 07406-0020201; A/T pressure hose, 2,210 mm 07MAJ-PY4011A; A/T pressure adapter 07MAJPY40120; oil pressure hose 07ZAJ-S5A0200.","Install the VTEC oil pressure switch in reverse order of removal, using a new O-ring.","Keep the oil pressure test under 1 minute because the engine runs with no load.","Steps 26 to 28 use the Programming and Relearning procedures (ECM/PCM reset, idle learn, CKP pattern learn)."],"steps":[["Note freeze data: engine speed, vehicle speed, throttle position, CLV, gear position.",null,null],["Clear the DTC with the HDS.",null,null],["Start the engine with no load (in Park or neutral) and let it idle.",null,null],["Monitor OBD STATUS for P0301, P0302, P0303, or P0304 in the DTCs MENU with the HDS.","If FAILED, go to step 9.","If PASSED, go to step 5. If EXECUTING, keep driving until a result appears. If OUT OF CONDITION, wait several minutes and recheck."],["Check CYL1, CYL2, CYL3, and/or CYL4 MISFIRE in the DATA LIST for 10 minutes with the HDS. Any misfire counts?","Go to step 9.","Go to step 6."],["Test-drive the vehicle for several minutes within the recorded freeze data range.",null,null],["Monitor OBD STATUS for P0301, P0302, P0303, or P0304 in the DTCs MENU with the HDS.","If FAILED, go to step 9.","If PASSED, go to step 8. If EXECUTING, keep driving until a result appears. If OUT OF CONDITION, go to step 6 and recheck."],["Check CYL1, CYL2, CYL3, and/or CYL4 MISFIRE in the DATA LIST for 10 minutes with the HDS. Any misfire counts?","Go to step 9.","Intermittent failure; system is OK at this time."],["Turn the ignition switch OFF.",null,null],["Check the fuel quality.","Go to step 11.","Drain the tank, fill with known-good fuel, then go to step 24."],["Inspect the spark plugs. Replace them if fouled or worn.",null,null],["Test-drive the vehicle for several minutes within the recorded freeze data range.",null,null],["Check CYL1, CYL2, CYL3, and/or CYL4 MISFIRE in the DATA LIST for 10 minutes with the HDS. Any misfire counts?","Go to step 14.","Go to step 24."],["Check the fuel pressure. If too high, replace the fuel pressure regulator, then go to step 24. If too low, check the fuel pump, fuel feed pipe, and fuel filter; if they are OK, replace the pressure regulator, then go to step 24.","If SULEV and LX-P model, go to step 15. If non-SULEV and LX-P model, go to step 19.","Repair as described in the text, then go to step 24."],["Start the engine. Hold engine speed at 3,000 rpm with no load (in Park or neutral) until the radiator fan comes on, then let it idle.",null,null],["Confirm: engine coolant temperature more than 176 °F (80 °C); transmission in neutral (A/T in Park or neutral); all electric loads off.",null,null],["Monitor ENG SPD in the DATA LIST with the HDS and hold engine speed at 4,500 rpm. Once reached, hold the accelerator pedal steady for more than 10 seconds.","If engine speed dropped more than 100 rpm from 4,500 rpm, repeat step 17.","If it did not drop more than 100 rpm, go to step 18."],["While holding 4,500 rpm, check MAF SENSOR in the DATA LIST with the HDS.","If about 14 - 20 gm/s, go to step 19.","Replace the MAF/IAT sensor, then go to step 24."],["Turn the ignition switch OFF (II).",null,null],["Remove the VTEC oil pressure switch (A), install the special tools as shown, then install the VTEC oil pressure switch (A) in the pressure gauge adapter (B).",null,null],["Reconnect the VTEC oil pressure switch 2P connector.",null,null],["Start the engine. Hold engine speed at 3,000 rpm with no load (in Park or neutral) until the radiator fan comes on, then let it idle.",null,null],["Check oil pressure at 1,000 rpm and 2,000 rpm. Keep the test under 1 minute.","If below 49 kPa (0.5 kgf/sq.cm, 7 psi), check fuel pressure and repair as needed, then go to step 24.","If not below 49 kPa (0.5 kgf/sq.cm, 7 psi), inspect the VTEC system, then go to step 24."],["Turn the ignition switch ON (II).",null,null],["Reset the ECM/PCM with the HDS.",null,null],["Clear the CKP pattern with the HDS. See the Programming and Relearning page.",null,null],["Perform the ECM/PCM idle learn procedure. See the Programming and Relearning page.",null,null],["Perform the CKP pattern learn procedure. See the Programming and Relearning page.",null,null],["Test-drive the vehicle for several minutes within the recorded freeze data range.",null,null],["Check for Temporary DTCs or DTCs with the HDS.","If P0300 to P0304 appear, check for poor connection or loose terminals at the ignition coil, injector, and ECM/PCM, then go to the troubleshooting page for DTC P0301, P0302, P0303, or P0304. If other DTCs appear, go to their troubleshooting.","Go to step 31."],["Monitor OBD STATUS for P0301, P0302, P0303, or P0304 in the DTCs MENU with the HDS.","If PASSED, troubleshooting is complete.","If FAILED, go to step 1 and recheck. If EXECUTING, keep driving until a result appears. If OUT OF CONDITION, go to step 29 and recheck."]]},"P0171":{"title":"Fuel System Too Lean","detection":"P0171 may take up to 40 minutes of test driving to set. Monitor LT FUEL TRIM or AF FB AVG with the HDS for 15 minutes while driving; if the value stays within 10% of 1.0% (0.0%), there is no problem at this time.","causes":["Low fuel pressure: faulty fuel pump or restricted/leaking fuel feed line","High fuel pressure: faulty fuel pressure regulator","Vacuum leaks: PCV valve, PCV hose, EVAP canister purge valve, throttle body, intake manifold, brake booster hose","Incorrect engine valve clearances","Faulty fuel injectors","Faulty MAF/IAT sensor (MAF reading out of range at 4,500 rpm)","Related DTCs that must be fixed first: P0107, P0108, P1128, P1129 (MAP sensor); P0133, P1157, P2195, P2238, P2252 (A/F sensor 1); P0134, P0135 (A/F sensor 1 heater); P0137, P0138, P0139 (HO2S 2); P0141 (HO2S 2 heater); P2646 to P2649 (VTEC); P0401, P0404, P0406, P2413 (EGR); P2279 (intake air leak, except SULEV and LX-P); P0443, P0496 (EVAP canister purge valve, SULEV and LX-P)"],"notes":["If related DTCs appear with P0171 and/or P0172, troubleshoot those first, then recheck for P0171 and/or P0172.","Fuel trim is acceptable if it stays within 10% of 1.0% (0.0%) over 15 minutes of driving.","Coolant temperature must exceed 158 °F (70 °C) in step 4 and 176 °F (80 °C) in step 11.","SULEV and LX-P models follow the EVAP-related path at step 2. Other models go to valve clearance checks at step 1."],"steps":[["Check the fuel pressure. If too high, replace the fuel pressure regulator. If too low, check the fuel pump and fuel feed line.","SULEV and LX-P models: go to step 2. Except SULEV and LX-P: check engine valve clearances and adjust if needed. If clearances are OK, replace the injectors, then go to step 7.","If pressure is too high, replace the fuel pressure regulator, then go to step 7. If too low, check the fuel pump and fuel feed line, then go to step 7."],["Check the PCV valve, PCV hose, EVAP canister purge valve, throttle body, intake manifold, and brake booster hose for vacuum leaks.","Go to step 3.","Repair or replace leaking parts, then go to step 7."],["Start the engine. Hold engine speed at 3,000 rpm with no load (in Park or neutral) until the radiator fan comes on, then let it idle.",null,null],["Confirm: engine coolant temperature above 158 °F (70 °C); transmission in neutral (A/T in Park or neutral); all electrical loads off.",null,null],["Monitor ENG SPD in the DATA LIST with the HDS and hold engine speed at 4,500 rpm. After reaching it, hold the accelerator pedal steady for more than 10 seconds.","Engine speed dropped more than 100 rpm from 4,500 rpm: repeat step 5.","Engine speed did not drop more than 100 rpm: go to step 6."],["While holding 4,500 rpm, check MAF SENSOR in the DATA LIST with the HDS. Reading should be about 14 to 20 gm/s.","Check engine valve clearances and adjust if needed. If clearances are OK, replace the injectors, then go to step 7.","Replace the MAF/IAT sensor, then go to step 7."],["Turn the ignition switch ON (II).",null,null],["Reset the ECM/PCM with the HDS.",null,null],["Perform the ECM/PCM idle learn procedure. See the Programming and Relearning page (Engine Control Module, Testing and Inspection).",null,null],["Start the engine. Hold engine speed at 3,000 rpm with no load (in Park or neutral) until the radiator fan comes on, then let it idle.",null,null],["Test-drive with engine coolant temperature above 176 °F (80 °C), transmission in neutral (A/T in Park or neutral), and all electrical loads off. Monitor LT FUEL TRIM or AF FB AVG with the HDS for 15 minutes; it may take up to 40 minutes of driving to set the DTC.",null,null],["Check for Temporary DTCs or DTCs with the HDS.","If P0171 or P0172 is indicated, go to step 1. If any other DTC is indicated, go to that DTC's troubleshooting.","Troubleshooting is complete."]]},"P0172":{"title":"Fuel System Too Rich","detection":null,"causes":["Fuel pressure too high (replace fuel pressure regulator)","Fuel pressure too low (fuel pump or fuel feed line)","Vacuum leaks: PCV valve, PCV hose, EVAP canister purge valve, throttle body, intake manifold, brake booster hose","Valve clearance out of spec or faulty injectors","MAF/IAT sensor out of range","Related DTCs: P0107, P0108, P1128, P1129 (MAP sensor); P0133, P1157, P2195, P2238, P2252 (A/F sensor 1); P0134, P0135 (A/F sensor 1 heater); P0137, P0138, P0139 (HO2S 2); P0141 (HO2S 2 heater); P2646 to P2649 (VTEC); P0401, P0404, P0406, P2413 (EGR); P2279 (intake air leak, except SULEV and LX-P); P0443, P0496 (EVAP purge valve, SULEV and LX-P)"],"notes":["If related DTCs are present with P0171 and/or P0172, troubleshoot those first, then recheck.","P0171 and/or P0172 may take up to 40 minutes of test driving to set.","The procedure uses the HDS scan tool for DATA LIST monitoring, ECM/PCM reset, and DTC checks."],"steps":[["Check the fuel pressure.","SULEV and LX-P: go to step 2. Except SULEV and LX-P: check and adjust engine valve clearances; if OK, replace injectors, then go to step 7.","If pressure is too high, replace fuel pressure regulator, then go to step 7. If too low, check fuel pump and fuel feed line, then go to step 7."],["Check for vacuum leaks at: PCV valve, PCV hose, EVAP canister purge valve, throttle body, intake manifold, brake booster hose.","Go to step 3.","Repair or replace leaking parts, then go to step 7."],["Start the engine. Hold engine speed at 3,000 rpm with no load (Park or neutral) until the radiator fan comes on, then let it idle.",null,null],["Confirm: engine coolant temperature above 158 °F (70 °C); transmission in neutral (A/T in Park or neutral); all electrical loads off.",null,null],["Monitor ENG SPD in the DATA LIST with the HDS and hold engine speed at 4,500 rpm. Once reached, hold the accelerator steady for more than 10 seconds. Did speed drop more than 100 rpm from 4,500 rpm?","Repeat step 5.","Go to step 6."],["While holding 4,500 rpm, check MAF SENSOR in the DATA LIST with the HDS. Should read about 14-20 gm/s.","Check and adjust engine valve clearances; if OK, replace injectors, then go to step 7.","Replace the MAF/IAT sensor, then go to step 7."],["Turn the ignition switch ON (II).",null,null],["Reset the ECM/PCM with the HDS.",null,null],["Perform the ECM/PCM idle learn procedure (see the Programming and Relearning page under Engine Control Module, Testing and Inspection).",null,null],["Start the engine. Hold engine speed at 3,000 rpm with no load (Park or neutral) until the radiator fan comes on, then let it idle.",null,null],["Test-drive with: engine coolant temperature above 176 °F (80 °C); transmission in neutral (A/T in Park or neutral); all electrical loads off. Using the HDS, monitor LT FUEL TRIM or AF FB AVG for 15 minutes while driving; if it stays within 10 % of 1.0 % (0.0 %), there is no problem at this time. The code may take up to 40 minutes to set.",null,null],["Check for Temporary DTCs or DTCs with the HDS.","If P0171 or P0172 is indicated, go to step 1. If any other DTC is indicated, go to that DTC's troubleshooting.","Troubleshooting is complete."]]},"P0420":{"title":"Catalyst System Efficiency Below Threshold","detection":null,"causes":["Poor quality fuel","Secondary HO2S (Sensor 2) codes P0137 or P0138 stored with P0420: diagnose these first","Secondary HO2S (Sensor 2) heater code P0141 stored with P0420: diagnose this first","ECM/PCM software not updated per Service Bulletin 03-063","Catalytic converter failure, only if P0420 resets after the software update"],"notes":["Do not replace the catalytic converter unless the ECM/PCM software has already been updated and P0420 sets again. Otherwise the repair is not lasting and may result in a warranty debit.","If secondary HO2S codes (P0137, P0138) or heater code (P0141) are stored with P0420, troubleshoot those first, then recheck P0420.","Poor quality fuel may cause this DTC."],"steps":[["Turn the ignition switch ON (II).",null,null],["Perform a DTC CLEAR in the CLEAR MENU of the Honda PGM tester or HDS.",null,null],["Start the engine. Hold engine speed at 3,000 rpm with no load (Park or neutral) until the radiator fan comes on, then let it idle.",null,null],["Test-drive: coolant above 158 °F (70 °C); transmission in 5th gear (A/T in D); cruise control at 50 to 55 mph (80 to 88 km/h). Drive about 2 minutes, decelerate at least 4 seconds with throttle fully closed, then accelerate to 55 mph (88 km/h) with cruise for 20 minutes.",null,null],["Monitor OBD STATUS for DTC P0420 in the DTC MENU of the Honda PGM tester or HDS. Is it EXECUTING?","Go to step 6.","Go to step 4 and recheck."],["Continue test driving until a result appears.",null,null],["Monitor OBD STATUS for DTC P0420 in the DTC MENU of the Honda PGM tester or HDS. Is it FAILED?","Go to step 8.","If PASSED: intermittent failure, system OK for now. If EXECUTING: keep driving until a result appears. If Out of CONDITION: go to step 4 and recheck."],["Turn the ignition switch OFF.",null,null],["Update ECM/PCM software using the Honda Interface Module (HIM). See Service Bulletin 03-063 for model application and procedure. Do not replace the catalytic converter unless the software is already updated and P0420 sets again.",null,null],["Turn the ignition switch ON (II).",null,null],["Perform an ECM/PCM RESET in the CLEAR MENU of the Honda PGM tester or HDS.",null,null],["Perform the ECM/PCM idle learn procedure. See the Programming and Relearning page (Relays and Modules, Engine Control Module, Testing and Inspection).",null,null],["Start the engine. Hold engine speed at 3,000 rpm with no load (Park or neutral) until the radiator fan comes on, then let it idle.",null,null],["Test-drive for about 10 minutes, continually changing vehicle speed.",null,null],["Check CATA MON TEMP in the DATA LIST of the Honda PGM tester or HDS. Is the temperature OK?","Go to step 16.","Go to step 13 and recheck."],["Test-drive: coolant above 158 °F (70 °C); transmission in 5th gear (A/T in D); cruise control at 50 to 55 mph (80 to 88 km/h). Drive about 2 minutes, decelerate at least 4 seconds with throttle fully closed, then accelerate to 55 mph (88 km/h) with cruise for 20 minutes.",null,null],["Monitor OBD STATUS for DTC P0420 in the DTCs MENU of the Honda PGM tester or HDS. Is it EXECUTING?","Go to step 18.","Go to step 16 and recheck."],["Continue test driving until a result appears.",null,null],["Check for temporary DTCs or DTCs in the DTCs MENU of the Honda PGM tester or HDS. Are any indicated?","Go to troubleshooting for the indicated DTCs.","Go to step 20."],["Monitor OBD STATUS for DTC P0420 in the DTCs MENU of the Honda PGM tester or HDS. Is it PASSED?","Troubleshooting is complete.","If FAILED: check fuel quality. If EXECUTING: keep driving until a result appears. If Out of CONDITION: go to step 13 and recheck."]]},"P0442":{"title":"EVAP System Small Leak Detected","detection":null,"causes":["Fuel fill cap missing, loose, or not tightened to 3 clicks","Damaged fuel fill cap seal or fuel fill pipe, or tether cord caught under cap","Poor connection or damage at fuel tank vapor recirculation tube","Leak in EVAP canister, EVAP canister vent shut valve, or purge line (PCS hose)","Worn FTP sensor O-ring or EVAP canister vent shut valve case/O-ring","Loose or damaged fuel fill pipe, fuel vapor return pipe, or fuel tank vapor signal tube (SULEV models)","Faulty fuel pump base gasket or fuel tank","Intermittent poor connections or loose terminals at FTP sensor, EVAP canister purge valve, EVAP canister vent shut valve, or ECM/PCM"],"notes":["Do not exceed the specified vacuum or pressure limits. Excess pressure or vacuum can damage EVAP components or the fuel tank.","Fresh fuel has higher volatility and creates greater pressure/vacuum. Test with less than a full tank.","For better leak detection, add 1 gallon of fresh fuel just before testing, as long as the tank will not overfill.","The fuel fill cap must be tightened 3 clicks or the check engine light may come on."],"steps":[["Verify the fuel fill cap is the correct type and tightened until it clicks 3 times. If not, replace or tighten it.","Go to step 2.","Replace or tighten the cap, then go to step 22."],["Inspect the fill cap seal, the fill pipe mating surface, and confirm the tether cord is not trapped under the cap. Any damage?","Replace the fill cap or fill pipe, then go to step 22.","Go to step 3."],["Turn the ignition switch ON (II).",null,null],["Clear the DTC using the HDS.",null,null],["Run the EVAP FUNCTION TEST in the INSPECTION MENU with the HDS. Did it pass?","Intermittent failure; system OK now. Check for poor connections or loose terminals at the FTP sensor, EVAP canister purge valve, EVAP canister vent shut valve, and ECM/PCM.","Go to step 6."],["Turn the ignition switch OFF.",null,null],["Turn the ignition switch ON (II).",null,null],["Inspect the fuel tank vapor recirculation tube for a poor connection or damage. Is it OK?","Go to step 9.","Replace the fuel tank vapor recirculation tube, then go to step 22. If needed, replace the fuel tank, then go to step 22."],["Disconnect the fuel tank vapor recirculation tube from the EVAP canister and plug the EVAP canister port.",null,null],["In the engine compartment, disconnect the vacuum hose (purge line) from the EVAP canister purge valve and connect a vacuum pump to the hose. Tool: Vacuum Pump/Gauge, 0-30 in.Hg, A973X-041-XXXXX.",null,null],["Activate EVAP CVS ON in the INSPECTION MENU with the HDS.",null,null],["Apply vacuum to the hose until the FTP reads 1.90 V (-0.59 in.Hg, -15.1 mmHg).",null,null],["Monitor the FTP SENSOR in the DATA LIST with the HDS for 1 minute. Does the voltage stay near 0.2 V (0.1 in.Hg, 2.5 mmHg)?","Go to step 19.","Go to step 14."],["Turn EVAP CVS OFF in the INSPECTION MENU with the HDS.",null,null],["Disconnect the fresh air hoses from the EVAP canister vent shut valve and plug the vent shut valve ports.",null,null],["Apply vacuum to the hose disconnected in step 10 until the FTP reads 1.90 V (-0.59 in.Hg, -15.1 mmHg).",null,null],["Monitor the FTP SENSOR in the DATA LIST with the HDS for 1 minute. Does the voltage stay near 0.2 V (0.1 in.Hg, 2.5 mmHg)?","Replace the EVAP canister vent shut valve, then go to step 21.","Go to step 18."],["Check the PCS line between the EVAP canister and EVAP canister purge valve for looseness or damage.","Replace the FTP sensor O-ring, the EVAP canister vent shut valve case and O-ring, and the EVAP canister, then go to step 21.","Reconnect or repair the PCS hose, then go to step 21."],["Turn EVAP CVS OFF in the INSPECTION MENU with the HDS.",null,null],["Check the fuel fill pipe, fuel vapor return pipe, and fuel tank vapor signal tube (SULEV models) for looseness or damage.","Check the fuel pump base gasket and the fuel tank, then go to step 21.","Repair or replace damaged parts, then go to step 21."],["Reconnect all hoses.",null,null],["Turn the ignition switch ON (II).",null,null],["Reset the ECM/PCM using the HDS.",null,null],["Perform the ECM/PCM idle learn procedure. See the Programming and Relearning page under Engine Control Module (Relays and Modules, Testing and Inspection).",null,null],["Run the EVAP FUNCTION TEST in the INSPECTION MENU with the HDS. Did it pass?","Troubleshooting complete.","Check for poor connections or loose terminals at the FTP sensor, EVAP canister purge valve, EVAP canister vent shut valve, and ECM/PCM, then go to step 1."]]},"P0128":{"title":"Cooling System Malfunction","detection":"Can occasionally set when the hood is opened while the engine is running.","causes":["Thermostat fault","Radiator fan circuit, radiator fan switch circuit, or radiator fan switch fault","Engine coolant temperature (ECT) sensor fault or poor connections/loose terminals at ECT sensor and ECM/PCM","ECM/PCM software out of date or faulty ECM/PCM","Cooling system problem","Related DTCs to troubleshoot first if stored with P0128: P0112, P0113, P0116, P0117, P0118, P0125, P0300, P0301 to P0304, P0335, P0339, P2227 to P2229, P2646 to P2649, P0506, P0507, P0511"],"notes":["If other listed DTCs are stored with P0128, troubleshoot them first, then recheck for P0128.","Step 17 uses the Programming and Relearning procedure (Engine Control Module section of Relays and Modules).","Cooling temperature target for steps 13 and 22: 23 °F (-5 °C) to 95 °F (35 °C).","Hold 3,000 rpm with no load (Park or neutral) when instructed to run the radiator fan."],"steps":[["Turn the ignition switch ON (II).",null,null],["Clear the DTC with the HDS.",null,null],["Turn the blower switch OFF.",null,null],["Turn the A/C switch OFF.",null,null],["Check FAN CTRL in the DATA LIST with the HDS. Is it OFF?","Go to step 6.","Wait until FAN CTRL is off, then go to step 6."],["Check ECT SENSOR in the DATA LIST with the HDS, then check radiator fan operation. Does the fan keep running when coolant temperature is below 158 °F (70 °C)?","Check the radiator fan circuit, radiator fan switch circuit, and radiator fan switch. If OK, go to step 21.","Go to step 7."],["Start the engine. Hold engine speed at 3,000 rpm with no load (Park or neutral) until the radiator fan comes on, then let it idle.",null,null],["Turn the ignition switch OFF.",null,null],["Turn the ignition switch ON (II).",null,null],["Run the RADIATOR FAN TEST in the INSPECTION MENU with the HDS for 20 minutes.",null,null],["Check ECT SENSOR in the DATA LIST with the HDS. Is it about 151 °F (66 °C) or less, or 1.25 V or more?","Intermittent failure; system is OK at this time.","Go to step 12."],["Turn the ignition switch OFF.",null,null],["Let the engine cool until coolant temperature is between 23 °F (-5 °C) and 95 °F (35 °C).",null,null],["Replace the thermostat.",null,null],["Turn the ignition switch ON (II).",null,null],["Reset the ECM/PCM with the HDS.",null,null],["Perform the ECM/PCM idle learn procedure. See the Programming and Relearning page under Engine Control Module, Testing and Inspection.",null,null],["Start the engine. Hold engine speed at 3,000 rpm with no load (Park or neutral) until the radiator fan comes on, then let it idle.",null,null],["Check for Temporary DTCs or DTCs with the HDS. Are any indicated?","If P0128 is indicated, check the cooling system, then go to step 1. If other DTCs are indicated, go to that DTC's troubleshooting.","Go to step 20."],["Monitor OBD STATUS for DTC P0128 in the DTCs MENU with the HDS. Does it show PASSED?","Troubleshooting is complete.","If FAILED, check the cooling system, then go to step 1. If NOT COMPLETED, go to step 18 and recheck."],["Update the ECM/PCM if it lacks the latest software, or substitute a known-good ECM/PCM.",null,null],["Let the engine cool until coolant temperature is between 23 °F (-5 °C) and 95 °F (35 °C).",null,null],["Start the engine. Hold engine speed at 3,000 rpm with no load (Park or neutral) until the radiator fan comes on, then let it idle.",null,null],["Check for Temporary DTCs or DTCs with the HDS. Are any indicated?","If P0128 is indicated, check for poor connections or loose terminals at the ECT sensor and ECM/PCM, then go to step 1. If other DTCs are indicated, go to that DTC's troubleshooting.","If the ECM/PCM was updated, troubleshooting is complete. If it was substituted, replace the original ECM/PCM."]]}},"home":"https://lemon-manuals.la/Honda/2003/Accord%20L4-2.4L/","zip":"https://lemon-manuals.la/bundle/Honda/2003/Accord%20L4-2.4L/","pages":{"fuel-test":{"title":"Fuel Pressure: Testing and Inspection","url":"https://lemon-manuals.la/Honda/2003/Accord%20L4-2.4L/Repair%20and%20Diagnosis/Maintenance/Tune-up%20and%20Engine%20Performance%20Checks/Fuel%20Pressure/Testing%20and%20Inspection/","summary":"Tests fuel system pressure with a gauge set, using a short list of pass/fail steps.","specs":[{"label":"Fuel pump run time at ignition on","value":"2 seconds"},{"label":"Fuel pressure","value":"330 - 380 kPa (3.4 - 3.9 kgf/sq.cm, 48 - 55 psi)"},{"label":"Fuel pressure gauge","value":"07406-004000A"},{"label":"Fuel pressure gauge set","value":"07ZAJ-S5A0100"},{"label":"Fuel hose attachment","value":"07ZAJ-S7C0100"},{"label":"Fuel joint attachment","value":"07ZAJ-S7CA200"}],"sections":[{"heading":"Fuel Pressure Test","steps":["Relieve the fuel pressure.","Disconnect the quick-connect fitting (A). Attach the fuel pressure gauge set and the fuel pressure gauge.","Start the engine and let it idle. If the engine starts, go to step 5. If it does not start, go function manualFor(v){
  if(!v)return null;
  for(var i=0;i<MANUALS.length;i++){
    var m=MANUALS[i],x=m.match;
    if(v.make===x.make&&+v.year===x.year&&(v.model||"").toLowerCase().indexOf(x.model.toLowerCase())===0){
      var e=(v.engine||"").toLowerCase();
      return{m:m,fit:!e?"maybe":(e.indexOf(x.engine)>=0?"yes":"no")};
    }
  }
  return null;
}

function manualLine(v){
  var f=manualFor(v),t;
  if(!f)t="No service manual is imported for this vehicle yet. Codes show generic guidance.";
  else if(f.fit==="no")t="Manual procedures are imported for the 2003 Accord 2.4L only. This vehicle's engine is different, so codes show generic guidance.";
  else t=Object.keys(f.m.procs).length+" trouble code procedures and "+Object.keys(f.m.pages||{}).length+" other pages imported from the "+f.m.label+" manual."+(f.fit==="maybe"?" Add the engine to confirm it is the 2.4L.":"");
  return '<div class="small" style="border-top:1px solid #34444f;padding-top:10px;color:var(--panel-ink)"><span class="muted">Service manual</span><br>'+esc(t)+'</div>';
}
function manualSearch(q){
  var words=q.toLowerCase().split(/\s+/).filter(Boolean),out=[];
  MANUALS.forEach(function(m){Object.keys(m.procs).sort().forEach(function(code){
    var p=m.procs[code];
    var hay=(code+" "+p.title+" "+p.causes.join(" ")+" "+p.notes.join(" ")+" "+p.steps.map(function(s){return s[0]+" "+(s[1]||"")+" "+(s[2]||"")}).join(" ")).toLowerCase();
    if(words.every(function(w){return hay.indexOf(w)>=0})){
      var si=-1,best=0;for(var i=0;i<p.steps.length;i++){var st=p.steps[i][0].toLowerCase(),sc=0;words.forEach(function(w){if(st.indexOf(w)>=0)sc++});if(sc>best){best=sc;si=i}}
      out.push({m:m,code:code,p:p,step:si});
    }
  })});
  return out;
}

var SITE="https://lemon-manuals.la/";

function viaProxy(url){

function blockText(node){
  var out=[];
  var BLOCK={P:1,DIV:1,LI:1,TR:1,H1:1,H2:1,H3:1,H4:1,H5:1,H6:1,BR:1,UL:1,OL:1,TABLE:1,SECTION:1,PRE:1,ARTICLE:1,DT:1,DD:1};

    if(b)out.push("\n");
    if(tag==="TD"||tag==="TH")out.push(" · ");

function parsePage(html,url){

async function lfetch(url){

   +(pg.lines.length?pg.lines.map(function(l){return'<p style="margin:0 0 8px;line-height:1.5">'+esc(l)+'</p>'}).join(""):'<div class="small muted">This page only lists sections below.</div>')+'</section>';

  h+='<div class="small muted"><a href="'+esc(pg.url)+'" target="_blank" rel="noopener">Open this page on lemon-manuals.la</a></div>';
  return h;
}
async function checkConn(){
  S.conn={busy:true};render(true);
  var res={};
  var t=async function(name,url){
    var c=new AbortController(),id=setTimeout(function(){c.abort()},12000);
    try{var r=await fetch(url,{signal:c.signal});res[name]=r.ok?"Reachable":"Answered with status "+r.status}
    catch(e){res[name]="Blocked or offline"}
    clearTimeout(id);
  };
  await t("NHTSA vPIC","https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/1HGCM82633A004352?format=json");
  await t(PROXY?"lemon-manuals.la via proxy":"lemon-manuals.la",viaProxy(SITE+"Honda/2003/"));
  S.conn=res;render(true);
}
function connCard(){
  var c=S.conn,h='<section class="card"><h2>Connection check</h2><div class="small muted">VIN decoding and the live manual both need this page to read NHTSA and lemon-manuals.la. If one says blocked, that feature will not work where you opened the app.</div>';
  if(c&&c.busy)h+='<div class="info">Checking.</div>';
  else if(c)h+=Object.keys(c).map(function(k){return'<div class="vp"><span class="k">'+esc(k)+'</span><span class="v">'+esc(c[k])+'</span></div>'}).join("");
  h+='<button class="btn sec" data-act="conn"'+(c&&c.busy?" disabled":"")+'>Run check</button>';
  h+='<details class="vinparts"'+(PROXY?"":"")+'><summary>Manual proxy address (optional)</summary><div class="small muted" style="padding-bottom:8px">If lemon-manuals.la blocks the check above, a small relay you control lets the app read its pages and build its own manual screens. Paste its address here, like https://yourname.workers.dev/ . Leave it empty to go without.</div><label for="proxy">Proxy address<input id="proxy" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="https://..." value="'+esc(S.proxyin!==undefined?S.proxyin:PROXY)+'"></label><button class="btn sec" data-act="proxyset">Save proxy</button></details></section>';
  return h;
}

/* ---------- Render ---------- */
function render(keepScroll){
  var main=document.getElementById("main");
  main.innerHTML={vehicle:screenVehicle,codes:screenCodes,manuals:screenManuals}[S.tab]();
  document.getElementById("tabs").innerHTML=[["vehicle","Vehicle"],["codes","Codes"],["manuals","Manuals"]].map(function(t){return '<button class="tab" data-act="goto" data-tab="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':"")+'>'+icon(t[0])+'<span>'+t[1]+'</span></button>'}).join("");
  if(!keepScroll)window.scrollTo(0,0);
}

/* ---------- Events ---------- */
document.addEventListener("click",async function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.dataset.act,d=el.dataset;
  if(a==="goto"){S.tab=d.tab;S.msg=null;if(d.tab==="codes"){S.proc=null;S.pfrom=null}else if(S.pfrom==="manuals"&&d.tab!=="manuals"){S.proc=null;S.pfrom=null}render();if(d.tab==="manuals")liveAuto()}
  else if(a==="mode"){S.mode=d.mode;S.msg=null;render(true)}
  else if(a==="sample"){S.vin="1HGCM82633A004352";S.msg=null;S.draft=null;render(true);document.getElementById("vin").focus()}
  else if(a==="decode"){
    var vv=S.vin.trim().toUpperCase();S.draft=null;
    if(vv.length!==17){S.msg={t:"err",m:"A VIN has 17 characters. Yours has "+vv.length+"."};render(true);return}
    if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vv)){S.msg={t:"err",m:"VINs never use the letters I, O or Q, and only letters and numbers."};render(true);return}
    S.vin=vv;S.msg=null;S.busy=true;render(true);
    var r=await decodeVin(vv);S.busy=false;S.draft=r;
    S.msg=r.src==="online"?{t:"good",m:"Decoded with the NHTSA database."}:{t:"info",m:"The NHTSA database could not be reached, so this read only what the VIN itself holds. Choose the rest below, or paste an NHTSA result. The connection check on the Vehicle tab shows what is blocked."};
    render(true);
    await aiEnrichVin(r);
  }
  else if(a==="savevin"){
    var veh=buildVehicle(S.draft);
    if(!veh.year||!veh.make||!veh.model){S.msg={t:"err",m:"Add a year, make and model to save."};render(true);return}
    S.vehicles=S.vehicles.filter(function(x){return !x.sample});S.vehicles.unshift(veh);S.active=veh.id;S.draft=null;S.vin="";S.msg=null;save();render();
  }
  else if(a==="saveymm"){
    var veh2=buildVehicle(S.ymm);
    if(!veh2.year||!veh2.make||!veh2.model){S.msg={t:"err",m:"Choose a year, make and model."};render(true);return}
    S.vehicles=S.vehicles.filter(function(x){return !x.sample});S.vehicles.unshift(veh2);S.active=veh2.id;S.ymm=blankForm();S.msg=null;save();render();
  }
  else if(a==="mview"){S.mview=d.v;render();if(d.v==="live")liveAuto()}
  else if(a==="liveload"){var L1=liveState();L1.err="";await liveLoad()}
  else if(a==="lpick"){var L2=liveState(),k2=L2.choices&&L2.choices[+d.i];if(k2){L2.busy=true;L2.err="";render(true);try{await liveChoose(k2)}catch(e){L2.err=liveErr(e)}L2.busy=false;render()}}
  else if(a==="lopen"){var L3=liveState(),cu=L3.stack[L3.stack.length-1],pg3=cu&&LCACHE[cu.url],k3=pg3&&pg3.kids[+d.i];if(k3){L3.busy=true;L3.err="";render(true);try{await liveGo(k3.url,L3.stack)}catch(e){L3.err=liveErr(e)}L3.busy=false;render()}}
  else if(a==="lback"){var L4=liveState();if(L4.stack.length>1){L4.stack.pop();L4.note="";render()}}
  else if(a==="lvariant"){var v5=activeV();if(v5){v5.liveRoot="";save();var L5=liveState();L5.stack=[];L5.choices=null;L5.err="";await liveLoad()}}
  else if(a==="livedtc"){S.tab="manuals";S.mview="live";S.proc=null;S.pfrom=null;render();await liveFindDtc(d.code)}
  else if(a==="conn"){await checkConn()}
  else if(a==="proxyset"){
    var pv=(S.proxyin!==undefined?S.proxyin:PROXY).trim();
    if(pv&&!/^https:\/\/[^\s]+$/.test(pv)){S.conn={"Proxy":"That is not an https address"};render(true);return}
    PROXY=pv;try{if(pv)localStorage.setItem("garage-proxy",pv);else localStorage.removeItem("garage-proxy")}catch(e){}
    LCACHE={};S.live={};S.embed=null;S.proxyin=undefined;S.conn={"Proxy":pv?"Saved. Run the check to test it.":"Removed"};render(true)
  }
  else if(a==="embed"){
    var ve=activeV();
    if(ve){
      var code0=(S.embed&&S.embed.code)||"",cur0=S.embed&&S.embed.url,nx=null;
      if(d.k==="close"){S.embed=null;render(true)}
      else{
        if(d.k==="open")nx=mkEmbed(ve,"");
        else if(d.k==="year")nx={url:yearUrl(ve),label:"Year list",code:code0};
        else if(d.k==="root")nx={url:ve.liveRoot||guessRoot(ve),label:"Vehicle manual",code:code0};
        else if(d.k==="diag")nx={url:(ve.liveRoot||guessRoot(ve))+"Repair%20and%20Diagnosis/",label:"Repair and Diagnosis",code:code0};
        else if(d.k==="dtc"&&code0)nx=mkEmbed(ve,code0);
        if(nx&&nx.url&&nx.url!==cur0){S.embed=nx;render(true)}
      }
    }
  }
  else if(a==="embedset"){
    var vs=activeV(),u9=null;
    try{u9=new URL(S.embedurl.trim())}catch(e){}
    var segs=u9?u9.pathname.split("/").filter(Boolean):[];
    if(!u9||u9.hostname.replace(/^www\./,"")!=="lemon-manuals.la"||segs.length<3){S.emsg="That does not look like a lemon-manuals.la manual page. It should look like https://lemon-manuals.la/Make/Year/Model/.";render(true)}
    else if(vs){
      S.emsg="";vs.liveRoot=u9.origin+"/"+segs.slice(0,3).join("/")+"/";
      var vseg=decodeURIComponent(segs[2]);applyVariant(vs,vseg);save();
      var c9=(S.embed&&S.embed.code)||"";S.embed=mkEmbed(vs,c9);S.embedurl="";render(true)
    }
  }
  else if(a==="scan"){var inp=document.getElementById("scan");if(inp)inp.click()}
  else if(a==="aifill"){var fa=formTarget();if(fa)await aiOptions(fa)}
  else if(a==="pickcfg"){
    var fc=formTarget(),cf=fc&&fc.cfgs&&fc.cfgs[+d.i];
    if(cf){fc.ci=+d.i;fc.disp=cf.d;fc.layout=cf.l;fc.fuel=cf.f;fc.asp=cf.a;
      if(cf.dr.length===1)fc.drive=cf.dr[0];
      if(cf.b.length===1&&!fc.body)fc.body=cf.b[0];
      fc.trans=cf.t.length===1?cf.t[0]:(cf.t.indexOf(fc.trans)>=0?fc.trans:"");
      addSrcRow(fc,"Suggested by Claude for the year, make and model, not a database. Check it against the car.");
      render(true)}
  }
  else if(a==="applypaste"){
    var px=parseVpic(S.paste),pv=S.vin.length===17?S.vin:bestVin([S.paste]);
    if(!(px.Make||px.Model||px.DisplacementL||px.BodyClass||px.TransmissionStyle)){S.msg={t:"err",m:"No NHTSA fields found in that text. Copy the whole results table from their page."};render(true);return}
    if(!pv){S.msg={t:"err",m:"Type the 17-character VIN above too, so it can be saved with the result."};render(true);return}
    S.vin=pv;S.draft=mapVpic(px,pv);S.msg={t:"good",m:"Read the NHTSA result."};render(true);await aiEnrichVin(S.draft);
  }
  else if(a==="pickeng"){var f1=formTarget();if(f1){f1.disp=d.d;f1.layout=d.l;f1.fuel=d.f||"Gasoline";if(!f1.asp)f1.asp="Naturally aspirated";render(true)}}
  else if(a==="picktrans"){var f2=formTarget();if(f2){f2.trans=d.t;render(true)}}
  else if(a==="edit"){var av=activeV();if(av){S.editing=av.id;S.eform=formFromVehicle(av);S.msg=null;render()}}
  else if(a==="canceledit"){S.editing=null;S.eform=null;S.msg=null;render()}
  else if(a==="saveedit"){
    var ev=buildVehicle(S.eform,S.editing);
    if(!ev.year||!ev.make||!ev.model){S.msg={t:"err",m:"Choose a year, make and model."};render(true);return}
    var eid=S.editing;S.vehicles=S.vehicles.map(function(x){return x.id===eid?ev:x});S.editing=null;S.eform=null;S.msg=null;save();render();
  }
  else if(a==="switch"){S.active=d.id;S.confirm=null;S.editing=null;S.eform=null;save();render()}
  else if(a==="remove"){
    if(S.confirm!==d.id){S.confirm=d.id;render(true);return}
    S.vehicles=S.vehicles.filter(function(x){return x.id!==d.id});if(S.active===d.id)S.active=S.vehicles[0]?S.vehicles[0].id:null;S.confirm=null;save();render(true);
  }
  else if(a==="opencode"){S.tab="codes";S.code=d.code;S.proc=null;S.recent=[d.code].concat(S.recent.filter(function(c){return c!==d.code})).slice(0,6);save();render()}
  else if(a==="back"){S.code=null;S.proc=null;render()}
  else if(a==="backdetail"){S.proc=null;render()}
  else if(a==="proc"){S.code=d.code;S.proc=d.code;S.procM=d.m||null;if(d.from==="manuals"){S.tab="manuals";S.pfrom="manuals"}else{S.tab="codes";S.pfrom=null}render()}
  else if(a==="step"){var arr=S.steps[d.code]||[];arr[+d.i]=!arr[+d.i];S.steps[d.code]=arr;save();render(true)}
  else if(a==="mark"){var i=S.marks.indexOf(d.code);if(i>=0)S.marks.splice(i,1);else S.marks.push(d.code);save();render(true)}
  else if(a==="mstep"){
    var arr2=S.steps[d.key]||[];arr2[+d.i]=!arr2[+d.i];S.steps[d.key]=arr2;save();
    var on=!!arr2[+d.i];el.setAttribute("aria-checked",String(on));
    var row=el.closest(".mstep");if(row)row.classList.toggle("done",on);
    var tot=document.querySelectorAll(".mstep").length,cnt=0;arr2.forEach(function(x){if(x)cnt++});
    var cc=document.getElementById("mcount");if(cc)cc.textContent=cnt+" of "+tot+" checked";
  }
  else if(a==="mreset"){S.steps[d.key]=[];save();render(true)}
  else if(a==="mnav"){S.mpath=S.mpath.concat([+d.i]);render()}
  else if(a==="mback"){S.mpath=S.mpath.slice(0,-1);render()}
  else if(a==="mgo"){S.mpath=S.mpath.slice(0,+d.d);render()}
  else if(a==="mopen"){S.mid=d.m;S.midFor=S.active;S.mpath=[];S.mq="";render()}
  else if(a==="mpage"){S.mid=d.m;S.midFor=S.active;S.mpath=d.path?d.path.split(".").map(Number):[];S.mq="";render()}
  else if(a==="mclose"){S.proc=null;S.procM=null;S.pfrom=null;render()}
  else if(a==="goref"){
    var tg=document.getElementById("ms"+d.n);
    if(tg){var rm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;tg.scrollIntoView({behavior:rm?"auto":"smooth",block:"center"});tg.classList.remove("flash");void tg.offsetWidth;tg.classList.add("flash")}
  }
});
document.addEventListener("input",function(e){
  var t=e.target,id=t.id;
  if(id==="q"){S.q=t.value;document.getElementById("results").innerHTML=resultsHtml(S.q)}
  else if(id==="mq"){S.mq=t.value;document.getElementById("mres").innerHTML=manualBody()}
  else if(id==="vin"){S.vin=t.value.toUpperCase();S.draft=null}
  else if(id==="paste"){S.paste=t.value}
  else if(id==="embedurl"){S.embedurl=t.value}
  else if(id==="proxy"){S.proxyin=t.value}
  else if(id==="fTrim"||id==="fCustom"){var ft=formTarget();if(ft)ft[FIELD[id]]=t.value}
  else if(id==="note"){S.notes[t.dataset.key]=t.value;save()}
});
document.addEventListener("change",function(e){
  var id=e.target.id,key=FIELD[id];
  if(id==="scan"){var fl=e.target.files&&e.target.files[0];e.target.value="";scanFile(fl);return}
  if(!key||id==="fTrim"||id==="fCustom")return;
  var f=formTarget();if(!f)return;
  f[key]=e.target.value;
  if(key==="make"){f.model="";f.custom=""}
  var idKey=key==="year"||key==="make"||key==="model";
  if(idKey){f.cfgs=null;f.ci=null;f.cfgsFor="";f.aiErr=""}
  render(true);
  var el=document.getElementById(id);if(el)el.focus();
  if(idKey&&!f.vin&&f.year&&f.make&&f.model&&f.model!=="__other")aiOptions(f);
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="vin"){e.preventDefault();var b=document.querySelector('[data-act="decode"]');if(b)b.click()}});
render();
